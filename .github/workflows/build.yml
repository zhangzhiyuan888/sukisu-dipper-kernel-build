      - name: Patch KSU 4.19 compat (file_wrapper + seccomp + su_mount_ns)
        working-directory: kernel
        run: |
          # KSU 新版代码用了 4.19 没有的 API,逐个加版本门槛或禁用:
          # 1. file_wrapper.c: iopoll(5.9+)/REMAP_FILE_DEDUP(5.5+)/remap_file_range(4.20+)
          # 2. seccomp_cache: 4.19 无 SECCOMP_ARCH_NATIVE_NR,且 KSU 自定义
          #    struct seccomp_filter 与 4.19 内核实际结构不符 -> 整体禁用(仅性能优化)
          # 3. su_mount_ns.c: include uapi/linux/mount.h(5.2+ 头)但未使用 -> 删除 include
          python3 - <<'PY'
          import re
          from pathlib import Path

          # ========== 1. file_wrapper.c ==========
          fw = Path("drivers/kernelsu/infra/file_wrapper.c")
          src = fw.read_text()
          orig = src
          # file_wrapper.c 是 CRLF,先统一转 LF 再打补丁(正则含 \n)
          src = src.replace("\r\n", "\n")

          # 1a. ksu_wrapper_iopoll 函数整体包 #if >= 5.9
          pat1 = re.compile(
              r"#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6, 1, 0\)\n"
              r"static int ksu_wrapper_iopoll.*?\n#endif\n",
              re.DOTALL)
          new_src, n1 = pat1.subn(
              lambda m: (
                  "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n"
                  + m.group(0)
                  + "#endif // iopoll is 5.9+\n"
              ),
              src, count=1)
          if n1:
              src = new_src
              print(f"patched iopoll wrapper ({n1} block)")
          else:
              print("WARNING: iopoll block not found")

          # 1b. ksu_wrapper_remap_file_range 函数整体包 #if >= 5.5
          pat2 = re.compile(
              r"static loff_t ksu_wrapper_remap_file_range\(.*?\n\}\n",
              re.DOTALL)
          new_src, n2 = pat2.subn(
              lambda m: (
                  "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 5, 0)\n"
                  + m.group(0)
                  + "#endif // remap_file_range is 4.20+/REMAP_FILE_DEDUP 5.5+\n"
              ),
              src, count=1)
          if n2:
              src = new_src
              print(f"patched remap_file_range wrapper ({n2} block)")
          else:
              print("WARNING: remap_file_range block not found")

          # 1c. p->ops.iopoll 赋值
          old3 = "    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;"
          new3 = (
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n"
              "    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n"
              "#endif\n"
          )
          if old3 in src:
              src = src.replace(old3, new3, 1)
              print("patched p->ops.iopoll assignment")
          else:
              print("WARNING: iopoll assignment not found")

          # 1d. p->ops.remap_file_range 赋值
          old4 = "    p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;"
          new4 = (
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 5, 0)\n"
              "    p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;\n"
              "#endif\n"
          )
          if old4 in src:
              src = src.replace(old4, new4, 1)
              print("patched p->ops.remap_file_range assignment")
          else:
              print("WARNING: remap_file_range assignment not found")

          if src != orig:
              fw.write_text(src)
              print("file_wrapper.c patched for 4.19 (CRLF->LF)")
          else:
              print("file_wrapper.c unchanged (already patched?)")

          # ========== 2. seccomp_cache 整体禁用 ==========
          # Kbuild: 去掉 seccomp_cache.o
          kb = Path("drivers/kernelsu/Kbuild")
          ksrc = kb.read_text().replace("\r\n", "\n")
          old = "kernelsu-objs += infra/seccomp_cache.o"
          new = "# kernelsu-objs += infra/seccomp_cache.o (4.19 lacks SECCOMP_ARCH_NATIVE_NR)"
          if old in ksrc:
              ksrc = ksrc.replace(old, new, 1)
              kb.write_text(ksrc)
              print("Kbuild: disabled seccomp_cache.o")
          else:
              print("WARNING: Kbuild seccomp line not found (already disabled?)")

          # setuid_hook.c: stub 两处调用
          sh = Path("drivers/kernelsu/hook/setuid_hook.c")
          ssrc = sh.read_text().replace("\r\n", "\n")
          old_call = "ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);"
          new_call = "/* ksu_seccomp_allow_cache disabled on 4.19 */\n        (void)__NR_reboot;"
          ncalls = ssrc.count(old_call)
          if ncalls:
              ssrc = ssrc.replace(old_call, new_call)
              sh.write_text(ssrc)
              print(f"setuid_hook.c: stubbed {ncalls} ksu_seccomp_allow_cache calls")
          else:
              print("WARNING: seccomp_allow_cache calls not found (already stubbed?)")

          # ========== 3. su_mount_ns.c 删除 uapi/linux/mount.h include ==========
          # 5.2+ 才有的 UAPI 头,4.19 没有;且本文件未使用其任何符号
          smns = Path("drivers/kernelsu/infra/su_mount_ns.c")
          mnsrc = smns.read_text().replace("\r\n", "\n")
          old_inc = "#include <uapi/linux/mount.h>\n"
          new_inc = "/* uapi/linux/mount.h removed: 5.2+ header, unused on 4.19 */\n"
          if old_inc in mnsrc:
              mnsrc = mnsrc.replace(old_inc, new_inc, 1)
              smns.write_text(mnsrc)
              print("su_mount_ns.c: removed uapi/linux/mount.h include")
          else:
              print("WARNING: su_mount_ns.c include not found (already removed?)")

          # ========== 4. pkg_observer.c 整体禁用 ==========
          # 4.19 的 fsnotify_ops 只有 handle_event(4.19 后重构为 handle_inode_event,参数全变)
          # 适配成本高,且只是包变化监控(非核心 root 功能) -> 禁用
          # 4a. Kbuild 注释 pkg_observer.o
          kb2 = Path("drivers/kernelsu/Kbuild")
          k2 = kb2.read_text().replace("\r\n", "\n")
          old_pkg = "kernelsu-objs += manager/pkg_observer.o"
          if old_pkg in k2:
              k2 = k2.replace(old_pkg, "# kernelsu-objs += manager/pkg_observer.o (4.19 fsnotify lacks handle_inode_event)", 1)
              kb2.write_text(k2)
              print("Kbuild: disabled pkg_observer.o")
          else:
              print("WARNING: Kbuild pkg_observer line not found")

          # 4b. init.c 注释调用(否则链接 undefined reference)
          ic2 = Path("drivers/kernelsu/core/init.c")
          isrc = ic2.read_text().replace("\r\n", "\n")
          n1 = isrc.count("ksu_observer_init();")
          n2 = isrc.count("ksu_observer_exit();")
          isrc = isrc.replace("ksu_observer_init();", "/* ksu_observer_init disabled: 4.19 fsnotify */", )
          isrc = isrc.replace("ksu_observer_exit();", "/* ksu_observer_exit disabled: 4.19 fsnotify */", )
          if n1 + n2:
              ic2.write_text(isrc)
              print(f"init.c: stubbed {n1} init + {n2} exit calls")
          else:
              print("WARNING: init.c observer calls not found")

          # 4c. boot_event.c 注释调用
          be2 = Path("drivers/kernelsu/runtime/boot_event.c")
          bsrc = be2.read_text().replace("\r\n", "\n")
          if "ksu_observer_init();" in bsrc:
              bsrc = bsrc.replace("ksu_observer_init();", "/* ksu_observer_init disabled: 4.19 fsnotify */", 1)
              be2.write_text(bsrc)
              print("boot_event.c: stubbed ksu_observer_init call")
          else:
              print("WARNING: boot_event.c observer call not found")

          # ========== 5. task_work 枚举 + fallthrough 宏 (4.19 兼容) ==========
          # 4.19 的 task_work_add 第三参数是 bool(非 TWA_RESUME 枚举)
          # fallthrough 宏 5.1+ 才有,GCC 直接支持 __attribute__((fallthrough))
          for f in ["drivers/kernelsu/policy/allowlist.c", "drivers/kernelsu/supercall/supercall.c"]:
              p = Path(f)
              s = p.read_text().replace("\r\n", "\n")
              changed = False
              if "TWA_RESUME" in s:
                  s = s.replace("TWA_RESUME", "true")
                  changed = True
              if "fallthrough;" in s:
                  s = s.replace("fallthrough;", "__attribute__((fallthrough));")
                  changed = True
              if changed:
                  p.write_text(s)
                  print(f"{f}: patched (TWA_RESUME->true, fallthrough->attr)")
              else:
                  print(f"{f}: no changes needed")

          # ========== 6. app_profile.c: seccomp 禁用逻辑 4.19 适配 ==========
          # filter_count 字段 5.5+ 才有 -> 删除(4.19 只需 mode=0 + filter=NULL)
          # seccomp_filter_release 函数 5.11+ 才有 -> 换 4.19 的 put_seccomp_filter(等价释放)
          ap = Path("drivers/kernelsu/policy/app_profile.c")
          asrc = ap.read_text().replace("\r\n", "\n")
          a_changed = False
          c1 = "    atomic_set(&current->seccomp.filter_count, 0);\n"
          if c1 in asrc:
              asrc = asrc.replace(c1, "    /* filter_count is 5.5+, not in 4.19 */\n", 1)
              a_changed = True
              print("app_profile.c: removed filter_count line")
          else:
              print("app_profile.c: filter_count line not found (already fixed?)")
          c2 = "    seccomp_filter_release(fake);"
          if c2 in asrc:
              asrc = asrc.replace(c2, "    put_seccomp_filter(fake); /* 4.19 equivalent */", 1)
              a_changed = True
              print("app_profile.c: seccomp_filter_release -> put_seccomp_filter")
          else:
              print("app_profile.c: seccomp_filter_release call not found (already fixed?)")
          if a_changed:
              ap.write_text(asrc)
              print("app_profile.c patched for 4.19")
          PY

      - name: Check out pinned AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.ANYKERNEL_COMMIT }}
          path: ak3
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libelf-dev libssl-dev lld llvm python3 zip unzip

      - name: Restore Android 16 Clang cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: clang
          key: android-clang-linux-x86-${{ env.CLANG_VERSION }}

      - name: Download Android 16 Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          for branch in android16-qpr2-release android16-release main-release; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${branch}/clang-${CLANG_VERSION}.tar.gz"
            echo "Trying ${url}"
            if curl -L --fail --retry 3 "$url" -o clang.tar.gz; then
              tar -xzf clang.tar.gz -C clang
              break
            fi
          done
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Save Android 16 Clang cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clang
          key: android-clang-linux-x86-${{ env.CLANG_VERSION }}

      - name: Verify Android 16 Clang
        run: |
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Convert kernel Python 2 scripts to Python 3 (2to3)
        working-directory: kernel
        run: |
          # 装 2to3
          if ! command -v 2to3 &>/dev/null; then
            echo "Installing python3-lib2to3..."
            sudo apt-get install -y python3-lib2to3 2>&1 | tail -3 || true
          fi
          # 用 Python subprocess 直接调 2to3,不用 xargs(更可靠)
          python3 - <<'PY'
          import subprocess, shutil, re
          from pathlib import Path

          # 找 2to3 命令
          to3_path = shutil.which("2to3")
          if to3_path:
              cmd = [to3_path, "-w", "-n"]
          else:
              cmd = ["python3", "-m", "lib2to3", "-w", "-n"]

          print(f"Using converter: {' '.join(cmd)}")

          fixed = 0
          for p in Path("scripts").rglob("*.py"):
              try:
                  src = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              # 只处理含 Python 2 print 语法的
              if re.search(r"^\s*print\s+[^(\n]", src, re.MULTILINE):
                  r = subprocess.run(cmd + [str(p)], capture_output=True, text=True)
                  if r.returncode == 0:
                      fixed += 1
                      print(f"  converted {p}")
                  else:
                      print(f"  FAILED {p}: {r.stderr[:200]}")

          print(f"Total converted: {fixed}")

          # 二次扫描,确认还有残留
          remaining = 0
          for p in Path("scripts").rglob("*.py"):
              try:
                  src = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if re.search(r"^\s*print\s+[^(\n]", src, re.MULTILINE):
                  remaining += 1
                  print(f"  STILL has Python 2 print: {p}")
          print(f"Remaining Python 2 print: {remaining}")
          PY

      - name: Configure munch kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make O=out vendor/munch_user_defconfig
          # 关键: config KSU depends on KPROBES && EXT4_FS
          # 且 KPROBES depends on KALLSYMS
          # 若 KPROBES 未启用,olddefconfig 会把 CONFIG_KSU 降为 n
          scripts/config --file out/.config \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPROBES \
            --enable KSU \
            --enable KSU_SUSFS \
            --disable KPM
          make O=out olddefconfig

          echo "=== .config KSU related ==="
          grep -E 'CONFIG_KALLSYMS|CONFIG_KPROBES|CONFIG_KSU|CONFIG_KPM' out/.config || true

          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx '# CONFIG_KPM is not set' out/.config
          echo "Configure OK"

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
          KBUILD_BUILD_USER: codex
          KBUILD_BUILD_HOST: github-actions
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          # 修复 GNU make 4.3 不自动创建 obj 子目录的问题
          # (4.19 Kbuild 的 $(shell mkdir -p $(obj-dirs)) 依赖 KBUILD_SRC,make 4.3 下未生效)
          # 方案:镜像所有源码目录到 out/,一劳永逸
          find . -type d -not -path './out/*' -not -path './.git*' \
            | sed 's|^\.|out|' | xargs mkdir -p
          echo "mirrored $(find . -type d -not -path './out/*' -not -path './.git*' | wc -l) source dirs to out/"
          # 用 GCC 交叉编译(小米官方方式),clang 编译 4.19 有 vdso/aes-modes 兼容问题
          # KCFLAGS=-w: GCC 14 默认把 implicit-int/implicit-function-declaration 当 error,
          # 4.19 老代码在 GCC 14 下编译不过,禁用所有警告(真错误仍会报)
          make -j"$(nproc)" O=out KSU_VERSION=${{ env.KSU_VERSION }} \
            KCFLAGS="-w" Image.gz-dtb

      - name: Verify compiled kernel
        working-directory: kernel
        run: |
          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz-dtb
          strings out/arch/arm64/boot/Image > /tmp/munch-kernel.strings
          grep -m1 -E '/data/adb/ksud|KernelSU|SukiSU' /tmp/munch-kernel.strings
          grep -m1 -F 'susfs is initialized! version:' /tmp/munch-kernel.strings
          grep -m1 -F "${{ env.SUSFS_VERSION }}" /tmp/munch-kernel.strings

          {
            echo "device=munch (Redmi K40S)"
            echo "sukisu_version=v4.1.3-40796"
            echo "susfs_version=${{ env.SUSFS_VERSION }}"
            echo "ksu_driver_version=${{ env.KSU_VERSION }}"
            echo "kernel_release=$(make -s O=out ARCH=arm64 kernelrelease)"
            echo "clang=$($GITHUB_WORKSPACE/clang/bin/clang --version | sed -n '1p')"
            echo "CONFIG_KSU=$(sed -n 's/^CONFIG_KSU=//p' out/.config)"
            echo "CONFIG_KSU_SUSFS=$(sed -n 's/^CONFIG_KSU_SUSFS=//p' out/.config)"
            echo "CONFIG_KPM=n"
            sha256sum out/arch/arm64/boot/Image.gz-dtb
          } > "$GITHUB_WORKSPACE/BUILD_INFO.txt"
          cat "$GITHUB_WORKSPACE/BUILD_INFO.txt"

      - name: Package AnyKernel3 ZIP
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          cp packaging/anykernel.sh ak3/anykernel.sh 2>/dev/null || true
          rm -rf ak3/.git ak3/.github
          find ak3 -name placeholder -delete
          mkdir -p release
          cd ak3
          zip -qr9 ../release/SukiSU-munch-SUSFS-v2.1-noKPM-v5.zip . \
            -x 'README.md' 'LICENSE'
          cd ..
          cp BUILD_INFO.txt release/
          sha256sum release/SukiSU-munch-SUSFS-v2.1-noKPM-v5.zip \
            | tee release/SHA256SUMS.txt

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-munch-SUSFS-v2.1-noKPM-v5
          path: release/*
          if-no-files-found: error
          retention-days: 30
