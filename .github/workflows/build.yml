# ============================================================
# K40S (munch) SukiSU Ultra + SusFS 内核编译 v5 最终版
# 思路:不再实时打补丁,直接使用本地验证过的预集成内核树
#   munch_sukisu_integrated.zip (208MB, SukiSU v4.1.3-40796 + SusFS v2.1.0)
#   上传到 GitHub Release 后,workflow 下载解压即可编译
# ============================================================

name: Build munch SukiSU kernel (preintegrated)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag containing munch_sukisu_integrated.zip'
        required: true
        default: 'munch-sukisu-v1'

permissions:
  contents: read

env:
  ANYKERNEL_COMMIT: e4b1bb25ca2aabcfd57f694a5998d87130701b71
  CLANG_VERSION: r563880
  KSU_VERSION: 40796
  SUSFS_VERSION: v2.1.0
  RELEASE_TAG: ${{ github.event.inputs.release_tag }}

jobs:
  build-munch:
    name: Build munch SukiSU kernel from preintegrated tree
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Download preintegrated kernel tree from Release
        run: |
          set -e
          url="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/munch_sukisu_integrated.zip"
          echo "Downloading from: ${url}"
          curl -L --fail --retry 3 --retry-delay 5 -o kernel_tree.zip "${url}"
          ls -lh kernel_tree.zip
          # 验证 zip 完整性
          python3 -c "
          import zipfile
          z = zipfile.ZipFile('kernel_tree.zip')
          bad = z.testzip()
          if bad:
              raise SystemExit(f'corrupt entry in zip: {bad}')
          print(f'zip OK: {len(z.namelist())} entries')
          "
          mkdir -p kernel
          # 解压到 kernel/(zip 顶层即内核根,含 Makefile)
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("kernel_tree.zip")
          for info in z.infolist():
              if info.filename.endswith("/"):
                  continue
              z.extract(info, "kernel")
          print(f"extracted {len(z.infolist())} entries")
          PY
          test -f kernel/Makefile
          test -f kernel/init/Kconfig
          test -f kernel/arch/arm64/configs/vendor/munch_user_defconfig
          test -f kernel/fs/susfs.c
          test -f kernel/drivers/kernelsu/Kconfig
          echo "kernel tree OK"

      - name: Normalize CRLF to LF in Kconfig files
        working-directory: kernel
        run: |
          # 本地集成脚本在 Windows 上写过 4 个 Kconfig 文件,产生 CRLF 行尾
          # Linux Kconfig 解析器不认 CRLF,把 \r 当 unsupported character
          python3 - <<'PY'
          from pathlib import Path

          fixed = 0
          # 只处理 Kconfig 文件(其他 .c/.h/.py 有 CRLF 不影响构建)
          for p in Path(".").rglob("Kconfig*"):
              try:
                  data = p.read_bytes()
              except Exception:
                  continue
              if b'\r\n' in data:
                  p.write_bytes(data.replace(b'\r\n', b'\n'))
                  fixed += 1
          print(f"Fixed {fixed} Kconfig files (CRLF -> LF)")
          # 关键路径二次确认
          for critical in ['Kconfig', 'drivers/Kconfig', 'drivers/kernelsu/Kconfig', 'KernelSU/Kconfig']:
              p = Path(critical)
              if p.exists():
                  crlf = b'\r\n' in p.read_bytes()
                  print(f"  {critical}: CRLF={crlf}")
          PY

      - name: Fix init/Kconfig $(shell,) syntax + chmod +x scripts
        working-directory: kernel
        run: |
          # 修 init/Kconfig 里 4.19 Kconfig 解析器不识别的 $(shell,...) 语法
          # 预集成包用的是 munch-s-oss HEAD 原始代码,没经过我之前 v4 的 fix
          python3 - <<'PY'
          from pathlib import Path

          kconfig = Path("init/Kconfig")
          src = kconfig.read_text()
          patterns = [
              (
                  "default $(shell,$(srctree)/scripts/gcc-version.sh -p $(CC) | sed 's/^0*//') if CC_IS_GCC",
                  "default 0 if CC_IS_GCC",
              ),
              (
                  "default $(shell,$(srctree)/scripts/clang-version.sh $(CC))",
                  "default 0",
              ),
              (
                  "default $(shell,echo \"$$CC_VERSION\" | head -n 1)",
                  "default 0",
              ),
          ]
          changed = 0
          for bad, good in patterns:
              if bad in src:
                  src = src.replace(bad, good, 1)
                  changed += 1
                  print(f"Replaced: {bad[:60]}...")
          if changed > 0:
              kconfig.write_text(src)
              print(f"Fixed {changed} Kconfig $(shell,...) patterns")
          else:
              print("No Kconfig $(shell,...) patterns needed fixing")

          # 修复 munch Makefile 的 CC 定义 bug:
          # L435 无条件用 $(REAL_CC),但 LLVM=1 时 REAL_CC 未定义(空)
          # -> CC = python gcc-wrapper.py (空编译器) -> Popen 执行编译选项失败
          # 修复:条件化,LLVM 时用 L401 的 CC=clang
          mk = Path("Makefile")
          msrc = mk.read_text()
          old_cc = "CC\t\t= $(PYTHON) $(srctree)/scripts/gcc-wrapper.py $(REAL_CC)"
          new_cc = (
              "ifeq ($(LLVM),)\n"
              "CC\t\t= $(PYTHON) $(srctree)/scripts/gcc-wrapper.py $(REAL_CC)\n"
              "endif"
          )
          if old_cc in msrc:
              msrc = msrc.replace(old_cc, new_cc, 1)
              mk.write_text(msrc)
              print("Patched Makefile: CC wrapper now only when !LLVM")
          else:
              print("Makefile CC line not found (maybe already patched)")

          # 修复 gcc-wrapper.py 的 Python 3 bytes/str 问题:
          # subprocess.Popen 默认 stderr 是 bytes,Python 3 里 for line in stderr 得到 bytes
          # line.rstrip('\\n') 需要 str -> TypeError: a bytes-like object is required
          # 修复: universal_newlines=True 让 stderr 以 str 返回
          gw = Path("scripts/gcc-wrapper.py")
          if gw.exists():
              gsrc = gw.read_text()
              old_popen = "proc = subprocess.Popen(args, stderr=subprocess.PIPE)"
              new_popen = "proc = subprocess.Popen(args, stderr=subprocess.PIPE, universal_newlines=True)"
              if old_popen in gsrc:
                  gsrc = gsrc.replace(old_popen, new_popen, 1)
                  gw.write_text(gsrc)
                  print("gcc-wrapper.py: added universal_newlines=True (fix bytes/str)")
              else:
                  print("gcc-wrapper.py Popen line not found (maybe already patched)")
          else:
              print("gcc-wrapper.py not found")
          PY

          # zip 解压丢失 Unix 文件权限,给所有脚本加执行位
          # 注意: 必须覆盖整个内核树(不仅是 scripts/),arch/arm64/kernel/vdso/gen_vdso_offsets.sh 也需要
          find . -type f \( -name "*.py" -o -name "*.sh" -o -name "*.pl" \) \
            -not -path './out/*' -not -path './.git*' -exec chmod +x {} \;
          # 无后缀但有 shebang 的脚本
          for f in scripts/config scripts/checkpatch.pl scripts/gcc-wrapper.py scripts/clang-wrapper.py; do
            if [ -f "$f" ] && ! head -c 2 "$f" | grep -q '#!'; then
              # 没有 shebang 不处理
              :
            fi
            [ -f "$f" ] && chmod +x "$f"
          done
          echo "chmod +x all scripts (.py .sh .pl) across kernel tree done"

      - name: Patch gcc-version.sh for clang compatibility
        working-directory: kernel
        run: |
          # gcc-version.sh 用 __GNUC__ 预处理器宏探测 GCC 版本
          # 但 make LLVM=1 时 CC=clang,clang 默认不定义 __GNUC__
          # clang -E 输出警告文本,printf "%02d%02d%02d" 收到非数字参数崩
          # 解决:替换成 clang 兼容 stub (KBUILD_VERSION 只影响 banner,不影响实际编译)
          python3 - <<'PY'
          from pathlib import Path
          Path("scripts/gcc-version.sh").write_text(
              "#!/bin/sh\n"
              "# stub for clang: KBUILD_VERSION does not affect build\n"
              "echo \"001300\"\n"
          )
          print("gcc-version.sh patched (clang-compatible stub)")
          PY
          chmod +x scripts/gcc-version.sh
          echo "gcc-version.sh patched (clang-compatible stub)"

      - name: Patch sched.h extern-inline + add SusFS task fields
        working-directory: kernel
        run: |
          # 两个问题:
          # 1. GCC14: sched.h 里 extern inline is_top_app 等(声明) 定义在 core.c,
          #    但 4.19 的 inline 宏 = always_inline,其他文件调用时 body not available
          #    修复: extern inline -> extern (去掉 always_inline,外部链接 core.c 符号)
          # 2. 预集成包 sched.h 漏了 SusFS 字段 susfs_task_state(本地集成遗漏)
          #    修复: 在 randomized_struct_fields_end 前插入 u64 字段
          python3 - <<'PY'
          import re
          from pathlib import Path

          sched = Path("include/linux/sched.h")
          src = sched.read_text()

          # 1. extern inline -> extern (解决 always_inline body not available)
          new_src = re.sub(r"extern inline\s+", "extern ", src)
          if new_src != src:
              print("sched.h: extern inline -> extern (fixed always_inline for GCC14)")
              src = new_src
          else:
              print("sched.h: no extern inline found (maybe already patched)")

          # 2. 加 SusFS 字段
          if "susfs_task_state" not in src:
              anchor = "\trandomized_struct_fields_end\n"
              inject = (
                  "#if defined(CONFIG_KSU_SUSFS)\n"
                  "\tu64 susfs_task_state;\n"
                  "\tu64 susfs_last_fake_mnt_id;\n"
                  "#endif\n"
                  "\trandomized_struct_fields_end\n"
              )
              if anchor in src:
                  src = src.replace(anchor, inject, 1)
                  print("sched.h: added susfs_task_state + susfs_last_fake_mnt_id fields")
              else:
                  print("sched.h: WARNING randomized_struct_fields_end anchor not found")
          else:
              print("sched.h: susfs_task_state already present")

          sched.write_text(src)
          # 验证
          check = sched.read_text()
          print("  susfs_task_state in sched.h:", "susfs_task_state" in check)
          print("  extern inline remaining:", len(re.findall(r"extern inline", check)))
          PY

      - name: Fix namespace.c SusFS calls + create uapi/app_profile.h
        working-directory: kernel
        run: |
          # 预集成包遗漏的 SusFS 修改(patch-namespace 之前失败被容忍):
          # 1. alloc_vfsmnt 1参数调用 -> 条件编译支持 3参数(CONFIG_KSU_SUSFS_SUS_MOUNT)
          # 2. is_current_zygote_domain 未声明 -> 插入 bool 定义
          # 3. allowlist.h include "uapi/app_profile.h" 但 uapi/ 不存在 -> 创建
          python3 - <<'PY'
          from pathlib import Path

          # --- 1. namespace.c ---
          ns = Path("fs/namespace.c")
          src = ns.read_text()
          fixed = 0

          # vfs_kern_mount: alloc_vfsmnt(name)
          old1 = "\tmnt = alloc_vfsmnt(name);"
          new1 = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\tmnt = alloc_vfsmnt(name, false, 0);\n"
              "#else\n"
              "\tmnt = alloc_vfsmnt(name);\n"
              "#endif\n"
          )
          if old1 in src:
              src = src.replace(old1, new1, 1)
              fixed += 1
              print("namespace.c: fixed alloc_vfsmnt in vfs_kern_mount")

          # clone_mnt: alloc_vfsmnt(old->mnt_devname)
          old2 = "\tmnt = alloc_vfsmnt(old->mnt_devname);"
          new2 = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\tmnt = alloc_vfsmnt(old->mnt_devname, false, 0);\n"
              "#else\n"
              "\tmnt = alloc_vfsmnt(old->mnt_devname);\n"
              "#endif\n"
          )
