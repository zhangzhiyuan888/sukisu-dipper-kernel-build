              src = src.replace(old3, new3, 1)
              fixed += 1
              print("namespace.c: added is_current_zygote_domain bool")
          else:
              print("namespace.c: WARNING zygote anchor not found")

          ns.write_text(src)
          print(f"namespace.c fixes applied: {fixed}")

