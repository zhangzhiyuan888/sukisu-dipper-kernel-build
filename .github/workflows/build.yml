          # is_current_zygote_domain: 在注释行前插入 bool 定义
          # 注意: 用单行匹配(namespace.c 是 CRLF,含 \\n 的多行匹配会失败)
          old3 = "\t// If caller process is zygote and not doing unshare, so we just reorder the mnt_id"
          new3 = (
              "\tbool is_current_zygote_domain = susfs_is_current_zygote_domain();\n"
              "\t// If caller process is zygote and not doing unshare, so we just reorder the mnt_id"
          )
