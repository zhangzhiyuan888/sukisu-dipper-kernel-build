# ============================================================
# K40S (munch) SukiSU Ultra + SusFS 内核编译 v5 最终版
# 思路:不再实时打补丁,直接使用本地验证过的预集成内核树
#   munch_sukisu_integrated.zip (208MB, SukiSU v4.1.3-40796 + SusFS v2.1.0)
#   上传到 GitHub Release 后,workflow 下载解压即可编译
# ============================================================

name: Build munch SukiSU kernel (preintegrated)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag containing munch_sukisu_integrated.zip'
        required: true
        default: 'munch-sukisu-v1'

permissions:
  contents: read

env:
  ANYKERNEL_COMMIT: e4b1bb25ca2aabcfd57f694a5998d87130701b71
  CLANG_VERSION: r563880
  KSU_VERSION: 40796
  SUSFS_VERSION: v2.1.0
  RELEASE_TAG: ${{ github.event.inputs.release_tag }}

jobs:
  build-munch:
    name: Build munch SukiSU kernel from preintegrated tree
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Download preintegrated kernel tree from Release
        run: |
          set -e
          url="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/munch_sukisu_integrated.zip"
          echo "Downloading from: ${url}"
          curl -L --fail --retry 3 --retry-delay 5 -o kernel_tree.zip "${url}"
          ls -lh kernel_tree.zip
          # 验证 zip 完整性
          python3 -c "
          import zipfile
          z = zipfile.ZipFile('kernel_tree.zip')
          bad = z.testzip()
          if bad:
              raise SystemExit(f'corrupt entry in zip: {bad}')
          print(f'zip OK: {len(z.namelist())} entries')
          "
          mkdir -p kernel
          # 解压到 kernel/(zip 顶层即内核根,含 Makefile)
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("kernel_tree.zip")
          for info in z.infolist():
              if info.filename.endswith("/"):
                  continue
              z.extract(info, "kernel")
          print(f"extracted {len(z.infolist())} entries")
          PY
          test -f kernel/Makefile
          test -f kernel/init/Kconfig
          test -f kernel/arch/arm64/configs/vendor/munch_user_defconfig
          test -f kernel/fs/susfs.c
          test -f kernel/drivers/kernelsu/Kconfig
          echo "kernel tree OK"

      - name: Normalize CRLF to LF in Kconfig files
        working-directory: kernel
        run: |
          # 本地集成脚本在 Windows 上写过 4 个 Kconfig 文件,产生 CRLF 行尾
          # Linux Kconfig 解析器不认 CRLF,把 \r 当 unsupported character
          python3 - <<'PY'
          from pathlib import Path

          fixed = 0
          # 只处理 Kconfig 文件(其他 .c/.h/.py 有 CRLF 不影响构建)
          for p in Path(".").rglob("Kconfig*"):
              try:
                  data = p.read_bytes()
              except Exception:
                  continue
              if b'\r\n' in data:
                  p.write_bytes(data.replace(b'\r\n', b'\n'))
                  fixed += 1
          print(f"Fixed {fixed} Kconfig files (CRLF -> LF)")
          # 关键路径二次确认
          for critical in ['Kconfig', 'drivers/Kconfig', 'drivers/kernelsu/Kconfig', 'KernelSU/Kconfig']:
              p = Path(critical)
              if p.exists():
                  crlf = b'\r\n' in p.read_bytes()
                  print(f"  {critical}: CRLF={crlf}")
          PY

      - name: Fix init/Kconfig $(shell,) syntax + chmod +x scripts
        working-directory: kernel
        run: |
          # 修 init/Kconfig 里 4.19 Kconfig 解析器不识别的 $(shell,...) 语法
          # 预集成包用的是 munch-s-oss HEAD 原始代码,没经过我之前 v4 的 fix
          python3 - <<'PY'
          from pathlib import Path

          kconfig = Path("init/Kconfig")
          src = kconfig.read_text()
          patterns = [
              (
                  "default $(shell,$(srctree)/scripts/gcc-version.sh -p $(CC) | sed 's/^0*//') if CC_IS_GCC",
                  "default 0 if CC_IS_GCC",
              ),
              (
                  "default $(shell,$(srctree)/scripts/clang-version.sh $(CC))",
                  "default 0",
              ),
              (
                  "default $(shell,echo \"$$CC_VERSION\" | head -n 1)",
                  "default 0",
              ),
          ]
          changed = 0
          for bad, good in patterns:
              if bad in src:
                  src = src.replace(bad, good, 1)
                  changed += 1
                  print(f"Replaced: {bad[:60]}...")
          if changed > 0:
              kconfig.write_text(src)
              print(f"Fixed {changed} Kconfig $(shell,...) patterns")
          else:
              print("No Kconfig $(shell,...) patterns needed fixing")

          # 修复 munch Makefile 的 CC 定义 bug:
          # L435 无条件用 $(REAL_CC),但 LLVM=1 时 REAL_CC 未定义(空)
          # -> CC = python gcc-wrapper.py (空编译器) -> Popen 执行编译选项失败
          # 修复:条件化,LLVM 时用 L401 的 CC=clang
          mk = Path("Makefile")
          msrc = mk.read_text()
          old_cc = "CC\t\t= $(PYTHON) $(srctree)/scripts/gcc-wrapper.py $(REAL_CC)"
          new_cc = (
              "ifeq ($(LLVM),)\n"
              "CC\t\t= $(PYTHON) $(srctree)/scripts/gcc-wrapper.py $(REAL_CC)\n"
              "endif"
          )
          if old_cc in msrc:
              msrc = msrc.replace(old_cc, new_cc, 1)
              mk.write_text(msrc)
              print("Patched Makefile: CC wrapper now only when !LLVM")
          else:
              print("Makefile CC line not found (maybe already patched)")
          PY

          # zip 解压丢失 Unix 文件权限,给所有脚本加执行位
          # 否则 Kconfig 解析器调 gcc-version.sh/clang-version.sh/gcc-plugin.sh 时 Permission denied
          # 同时 scripts/config (无后缀的 Python 脚本) 也要 chmod +x
          find scripts/ -type f \( -name "*.py" -o -name "*.sh" -o -name "*.pl" \) -exec chmod +x {} \;
          # 无后缀但有 shebang 的脚本
          for f in scripts/config scripts/checkpatch.pl scripts/gcc-wrapper.py scripts/clang-wrapper.py; do
            if [ -f "$f" ] && ! head -c 2 "$f" | grep -q '#!'; then
              # 没有 shebang 不处理
              :
            fi
            [ -f "$f" ] && chmod +x "$f"
          done
          echo "chmod +x scripts/*.py and *.sh and *.pl done"

      - name: Patch gcc-version.sh for clang compatibility
        working-directory: kernel
        run: |
          # gcc-version.sh 用 __GNUC__ 预处理器宏探测 GCC 版本
          # 但 make LLVM=1 时 CC=clang,clang 默认不定义 __GNUC__
          # clang -E 输出警告文本,printf "%02d%02d%02d" 收到非数字参数崩
          # 解决:替换成 clang 兼容 stub (KBUILD_VERSION 只影响 banner,不影响实际编译)
          python3 - <<'PY'
          from pathlib import Path
          Path("scripts/gcc-version.sh").write_text(
              "#!/bin/sh\n"
              "# stub for clang: KBUILD_VERSION does not affect build\n"
              "echo \"001300\"\n"
          )
          print("gcc-version.sh patched (clang-compatible stub)")
          PY
          chmod +x scripts/gcc-version.sh
          echo "gcc-version.sh patched (clang-compatible stub)"

      - name: Check out pinned AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.ANYKERNEL_COMMIT }}
          path: ak3
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libelf-dev libssl-dev lld llvm python3 zip unzip

      - name: Restore Android 16 Clang cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: clang
          key: android-clang-linux-x86-${{ env.CLANG_VERSION }}

      - name: Download Android 16 Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          for branch in android16-qpr2-release android16-release main-release; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${branch}/clang-${CLANG_VERSION}.tar.gz"
            echo "Trying ${url}"
            if curl -L --fail --retry 3 "$url" -o clang.tar.gz; then
              tar -xzf clang.tar.gz -C clang
              break
            fi
          done
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Save Android 16 Clang cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clang
          key: android-clang-linux-x86-${{ env.CLANG_VERSION }}

      - name: Verify Android 16 Clang
        run: |
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Convert kernel Python 2 scripts to Python 3 (2to3)
        working-directory: kernel
        run: |
          # 装 2to3
          if ! command -v 2to3 &>/dev/null; then
            echo "Installing python3-lib2to3..."
            sudo apt-get install -y python3-lib2to3 2>&1 | tail -3 || true
          fi
          # 用 Python subprocess 直接调 2to3,不用 xargs(更可靠)
          python3 - <<'PY'
          import subprocess, shutil, re
          from pathlib import Path

          # 找 2to3 命令
          to3_path = shutil.which("2to3")
          if to3_path:
              cmd = [to3_path, "-w", "-n"]
          else:
              cmd = ["python3", "-m", "lib2to3", "-w", "-n"]

          print(f"Using converter: {' '.join(cmd)}")

          fixed = 0
          for p in Path("scripts").rglob("*.py"):
              try:
                  src = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              # 只处理含 Python 2 print 语法的
              if re.search(r"^\s*print\s+[^(\n]", src, re.MULTILINE):
                  r = subprocess.run(cmd + [str(p)], capture_output=True, text=True)
                  if r.returncode == 0:
                      fixed += 1
                      print(f"  converted {p}")
                  else:
                      print(f"  FAILED {p}: {r.stderr[:200]}")

          print(f"Total converted: {fixed}")

          # 二次扫描,确认还有残留
          remaining = 0
          for p in Path("scripts").rglob("*.py"):
              try:
                  src = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if re.search(r"^\s*print\s+[^(\n]", src, re.MULTILINE):
                  remaining += 1
                  print(f"  STILL has Python 2 print: {p}")
          print(f"Remaining Python 2 print: {remaining}")
          PY

      - name: Configure munch kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make O=out vendor/munch_user_defconfig
          # 关键: config KSU depends on KPROBES && EXT4_FS
          # 且 KPROBES depends on KALLSYMS
          # 若 KPROBES 未启用,olddefconfig 会把 CONFIG_KSU 降为 n
          scripts/config --file out/.config \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPROBES \
            --enable KSU \
            --enable KSU_SUSFS \
            --disable KPM
          make O=out olddefconfig

          echo "=== .config KSU related ==="
          grep -E 'CONFIG_KALLSYMS|CONFIG_KPROBES|CONFIG_KSU|CONFIG_KPM' out/.config || true

          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx '# CONFIG_KPM is not set' out/.config
          echo "Configure OK"

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
          KBUILD_BUILD_USER: codex
          KBUILD_BUILD_HOST: github-actions
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          # 修复 GNU make 4.3 不自动创建 obj 子目录的问题
          # (4.19 Kbuild 的 $(shell mkdir -p $(obj-dirs)) 依赖 KBUILD_SRC,make 4.3 下未生效)
          # 方案:镜像所有源码目录到 out/,一劳永逸
          find . -type d -not -path './out/*' -not -path './.git*' \
            | sed 's|^\.|out|' | xargs mkdir -p
          echo "mirrored $(find . -type d -not -path './out/*' -not -path './.git*' | wc -l) source dirs to out/"
          # 用 GCC 交叉编译(小米官方方式),clang 编译 4.19 有 vdso/aes-modes 兼容问题
          make -j"$(nproc)" O=out KSU_VERSION=${{ env.KSU_VERSION }} Image.gz-dtb

      - name: Verify compiled kernel
        working-directory: kernel
        run: |
          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz-dtb
          strings out/arch/arm64/boot/Image > /tmp/munch-kernel.strings
          grep -m1 -E '/data/adb/ksud|KernelSU|SukiSU' /tmp/munch-kernel.strings
          grep -m1 -F 'susfs is initialized! version:' /tmp/munch-kernel.strings
          grep -m1 -F "${{ env.SUSFS_VERSION }}" /tmp/munch-kernel.strings

          {
            echo "device=munch (Redmi K40S)"
            echo "sukisu_version=v4.1.3-40796"
            echo "susfs_version=${{ env.SUSFS_VERSION }}"
            echo "ksu_driver_version=${{ env.KSU_VERSION }}"
            echo "kernel_release=$(make -s O=out ARCH=arm64 kernelrelease)"
            echo "clang=$($GITHUB_WORKSPACE/clang/bin/clang --version | sed -n '1p')"
            echo "CONFIG_KSU=$(sed -n 's/^CONFIG_KSU=//p' out/.config)"
            echo "CONFIG_KSU_SUSFS=$(sed -n 's/^CONFIG_KSU_SUSFS=//p' out/.config)"
            echo "CONFIG_KPM=n"
            sha256sum out/arch/arm64/boot/Image.gz-dtb
          } > "$GITHUB_WORKSPACE/BUILD_INFO.txt"
          cat "$GITHUB_WORKSPACE/BUILD_INFO.txt"

      - name: Package AnyKernel3 ZIP
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          cp packaging/anykernel.sh ak3/anykernel.sh 2>/dev/null || true
          rm -rf ak3/.git ak3/.github
          find ak3 -name placeholder -delete
          mkdir -p release
          cd ak3
          zip -qr9 ../release/SukiSU-munch-SUSFS-v2.1-noKPM-v5.zip . \
            -x 'README.md' 'LICENSE'
          cd ..
          cp BUILD_INFO.txt release/
          sha256sum release/SukiSU-munch-SUSFS-v2.1-noKPM-v5.zip \
            | tee release/SHA256SUMS.txt

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-munch-SUSFS-v2.1-noKPM-v5
          path: release/*
          if-no-files-found: error
          retention-days: 30
