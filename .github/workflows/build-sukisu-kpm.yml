name: Build munch SukiSU-KPM kernel (koyufox)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: koyufox/kernel_xiaomi_sm8250
  KERNEL_BRANCH: main

jobs:
  build-munch:
    name: Build munch sukisu-kpm miui
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout koyufox kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev \
            lld llvm python3 zip unzip git cpio

      - name: Download proton-clang 20210522
        run: |
          mkdir -p proton-clang
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip" -o clang.zip
          unzip -q clang.zip
          mv proton-clang-20210522 proton-clang/proton-clang-20210522
          test -x proton-clang/proton-clang-20210522/bin/clang
          proton-clang/proton-clang-20210522/bin/clang --version | head -2

      - name: Patch build.sh (KPROBES + KSU_MANUAL_HOOK + lock SukiSU v3.2.0 + SusFS integration)
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path("build.sh")
          s = p.read_text()

          # 1) Lock SukiSU to v3.2.0 (last KPM-compatible 4.19 release) for BOTH sukisu and sukisu-kpm cases.
          #    Target the exact curl|bash line so we don't touch the rsuntk (rksu) one.
          n = s.count('curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki')
          s = s.replace(
              'curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki',
              'curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/v3.2.0/kernel/setup.sh" | bash -s v3.2.0')
          print(f"patched SukiSU setup -> v3.2.0 ({n} occurrence(s))")

          # 2) SukiSU depends on KPROBES (else olddefconfig silently drops KSU);
          #    enable KALLSYMS (KPM needs it) and KSU_SUSFS.
          n1 = s.count("scripts/config --file out/.config -e KSU\n")
          s = s.replace(
              "scripts/config --file out/.config -e KSU\n",
              "scripts/config --file out/.config -e KSU -e KPROBES -e KALLSYMS -e KALLSYMS_ALL -e KSU_SUSFS\n", 1)
          print(f"patched -e KSU line ({n1} found, +KPROBES+KALLSYMS+KSU_SUSFS)")

          # 3) sukisu-kpm branch does '-d KSU_MANUAL_HOOK'; non-GKI 4.19 needs manual hooks -> enable.
          n2 = s.count("scripts/config --file out/.config -d KSU_MANUAL_HOOK")
          s = s.replace(
              "scripts/config --file out/.config -d KSU_MANUAL_HOOK",
              "scripts/config --file out/.config -e KSU_MANUAL_HOOK")
          print(f"patched KSU_MANUAL_HOOK ({n2} -> enable)")

          # 4) Embed the SusFS 4.19 integration script (base64) right before "Cleaning...".
          B64 = ""
          inject = base64.b64decode(B64).decode("utf-8")
          anchor = 'echo "Cleaning..."'
          if anchor in s:
              s = s.replace(anchor, inject + "\n" + anchor, 1)
              print("injected SusFS integration before 'Cleaning...'")
          else:
              print("WARNING: anchor 'Cleaning...' not found!")

          p.write_text(s)
          print("build.sh patched OK")
          PY

      - name: Build munch SukiSU-KPM for MIUI (v3.2.0 + SusFS)
        working-directory: kernel
        run: |
          bash build.sh munch sukisu-kpm miui 2>&1 | tee /tmp/build.log
          echo "=== build log tail ==="
          tail -25 /tmp/build.log
          echo "=== flashable zip ==="
          ls -la *.zip 2>&1
          test -f *.zip && echo "ZIP OK"

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: munch-sukisu-miui
          path: kernel/*.zip
          if-no-files-found: error
          retention-days: 30
