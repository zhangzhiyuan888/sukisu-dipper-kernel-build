name: Build munch SukiSU-KPM kernel (koyufox)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: koyufox/kernel_xiaomi_sm8250
  KERNEL_BRANCH: main

jobs:
  build-munch:
    name: Build munch sukisu-kpm miui
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout koyufox kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev \
            lld llvm python3 zip unzip git cpio

      - name: Download proton-clang 20210522
        run: |
          mkdir -p proton-clang
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip" -o clang.zip
          unzip -q clang.zip
          mv proton-clang-20210522 proton-clang/proton-clang-20210522
          test -x proton-clang/proton-clang-20210522/bin/clang
          proton-clang/proton-clang-20210522/bin/clang --version | head -2

      - name: Patch build.sh (KPROBES + KSU_MANUAL_HOOK + lock SukiSU tag for 4.19)
        working-directory: kernel
        run: |
          # 修复 koyufox build.sh 的三个 4.19 坑:
          # 1. SukiSU 4.x config KSU depends on KPROBES,但 build.sh 没 enable
          #    -> olddefconfig 会把 KSU 静默降为 n,KSU 根本不编译进内核
          # 2. sukisu-kpm 分支会 -d KSU_MANUAL_HOOK,但非 GKI 4.19 需要它
          # 3. build.sh 用 'setup.sh -s nongki' 是旧接口(已失效,回退 main 最新)
          #    SukiSU main 的 KPM 代码已改用 5.x access_ok(2参),4.19 编译失败
          #    -> 锁定到稳定 tag v4.1.3 (KPM 代码仍是 4.19 时代)
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.sh")
          s = p.read_text()
          n1 = s.count("scripts/config --file out/.config -e KSU\n")
          s = s.replace(
              "scripts/config --file out/.config -e KSU\n",
              "scripts/config --file out/.config -e KSU -e KPROBES -e KALLSYMS -e KALLSYMS_ALL\n", 1)
          print(f"patched KSU enable line ({n1} found, 1 replaced)")
          n2 = s.count("scripts/config --file out/.config -d KSU_MANUAL_HOOK")
          s = s.replace(
              "scripts/config --file out/.config -d KSU_MANUAL_HOOK",
              "scripts/config --file out/.config -e KSU_MANUAL_HOOK")
          print(f"patched KSU_MANUAL_HOOK ({n2} -> enable)")
          n3 = s.count("bash -s nongki")
          s = s.replace("bash -s nongki", "bash -s v4.1.3")
          print(f"patched setup.sh arg nongki -> v4.1.3 ({n3} replaced)")

          # 4. v4.1.3 的 4.19 兼容补丁(在 setup.sh 集成 KSU 源码后执行):
          #    a. init.c: MODULE_IMPORT_NS 是 5.4+ 宏 -> #if 包起来
          #    b. sucompat.c: linux/pgtable.h 是 5.0+ 头 -> 删除(未用其符号)
          #    (base64 编码避免 YAML 缩进问题)
          import base64
          inject = base64.b64decode("").decode("utf-8")
          anchor = 'echo "Cleaning..."'
          na = s.count(anchor)
          s = s.replace(anchor, inject + anchor, 1)
          print(f"injected 4.19 compat patch before 'Cleaning...' ({na} anchor found)")

          p.write_text(s)
          print("build.sh patched OK")
          PY

      - name: Build munch SukiSU (noKPM) for MIUI
        working-directory: kernel
        run: |
          bash build.sh munch sukisu miui 2>&1 | tee /tmp/build.log
          echo "=== build log tail ==="
          tail -20 /tmp/build.log
          echo "=== flashable zip ==="
          ls -la *.zip 2>&1
          test -f *.zip && echo "ZIP OK"

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: munch-sukisu-miui
          path: kernel/*.zip
          if-no-files-found: error
          retention-days: 30
